<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizaciones HighLevel</title>
  <style>
    :root { --ink:#12344d; --muted:#6b7c8f; --line:#d9e2ec; --brand:#116b8c; --soft:#eef6f8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; color:#1f2933; background:#f4f7f9; }
    main { width:min(1120px,calc(100% - 32px)); margin:36px auto; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
    h1 { margin:0 0 6px; color:var(--ink); font-size:30px; }
    p { color:var(--muted); margin:0; line-height:1.5; }
    .badge { padding:8px 12px; border-radius:999px; background:#fff4d6; color:#785a00; font-weight:700; font-size:13px; }
    .badge.live { background:#ddf7e8; color:#17633a; }
    .panel { background:white; border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 8px 24px rgba(18,52,77,.06); }
    form { display:grid; grid-template-columns:1fr 1fr 170px auto; gap:12px; align-items:end; }
    label { display:grid; gap:7px; color:var(--ink); font-size:13px; font-weight:700; }
    input,select,button,a.button { height:42px; border-radius:8px; border:1px solid #b8c6d1; padding:0 12px; font:inherit; }
    button,a.button { display:inline-flex; align-items:center; justify-content:center; border:0; background:var(--brand); color:white; font-weight:700; cursor:pointer; text-decoration:none; white-space:nowrap; }
    a.secondary { background:white; color:var(--ink); border:1px solid #9fb1bf; }
    .message { min-height:24px; margin:14px 0 4px; color:var(--muted); }
    table { width:100%; border-collapse:collapse; margin-top:18px; }
    th { text-align:left; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line); padding:12px 10px; }
    td { padding:14px 10px; border-bottom:1px solid #edf1f4; vertical-align:middle; }
    td:last-child { text-align:right; }
    .actions { display:flex; gap:8px; justify-content:flex-end; }
    .actions .button { height:36px; font-size:13px; }
    .status { display:inline-block; padding:5px 9px; border-radius:999px; background:var(--soft); color:var(--brand); font-size:12px; font-weight:700; }
    .empty { padding:34px; text-align:center; color:var(--muted); }
    .toolbar { display:flex; justify-content:flex-end; margin-top:12px; }
    .editor { display:none; margin-top:20px; border-top:1px solid var(--line); padding-top:20px; }
    .editor.open { display:block; }
    .editor-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .editor-grid .wide { grid-column:span 3; }
    .items-editor { width:100%; border-collapse:collapse; margin-top:12px; }
    .items-editor th,.items-editor td { padding:7px; border:1px solid var(--line); }
    .items-editor input { width:100%; height:34px; }
    .catalog-box { background:#faf7ff; border:1px solid #d9b8ff; border-left:5px solid #8c1dff; border-radius:8px; padding:12px; margin:10px 0 16px; }
    .catalog-box p { margin:5px 0 10px; color:#52606D; }
    .editor-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
    .danger { background:#b42318 !important; }
    textarea { min-height:70px; padding:9px; border:1px solid #b8c6d1; border-radius:8px; font:inherit; }
    @media(max-width:820px){ form{grid-template-columns:1fr 1fr} header{display:block}.badge{display:inline-block;margin-top:12px} }
    @media(max-width:560px){ form{grid-template-columns:1fr} table,thead,tbody,tr,th,td{display:block} thead{display:none} td{border:0;padding:5px 0} tr{padding:14px 0;border-bottom:1px solid var(--line)} td:last-child{text-align:left}.actions{justify-content:flex-start;margin-top:10px} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Cotizaciones</h1><p>Consulta borradores de HighLevel, revisa la información y genera un PDF en español.</p></div>
      <span id="mode" class="badge">Cargando...</span>
    </header>
    <section class="panel">
      <form id="filters">
        <label>ID del contacto (opcional)<input id="contactId" placeholder="Ej. 6578278e..."></label>
        <label>Buscar por nombre<input id="search" placeholder="Proyecto o cliente"></label>
        <label>Estado<select id="status"><option value="draft">Borrador</option><option value="sent">Enviada</option><option value="viewed">Vista</option><option value="accepted">Aceptada</option><option value="declined">Rechazada</option><option value="invoiced">Facturada</option><option value="all">Todos</option></select></label>
        <button type="submit">Consultar</button>
      </form>
      <div id="message" class="message"></div>
      <div class="toolbar"><button type="button" id="newEstimate">Nueva cotización</button></div>
      <div id="results"></div>
      <section id="editor" class="editor">
        <h2 id="editorTitle">Nueva cotización</h2>
        <div class="editor-grid">
          <label>Nombre<input id="fName" required></label>
          <label>Número<input id="fNumber" type="number"></label>
          <label>Moneda<select id="fCurrency"><option>MXN</option><option>USD</option></select></label>
          <label>Fecha<input id="fIssue" type="date"></label>
          <label>Vigencia (días)<input id="fValidity" type="number" value="15"></label>
          <label>Fecha vencimiento<input id="fExpiry" type="date"></label>
          <label>Cliente<input id="fContactName"></label>
          <label>Contact ID<input id="fContactId"></label>
          <label>Correo<input id="fEmail" type="email"></label>
          <label class="wide">Términos y observaciones<textarea id="fTerms"></textarea></label>
        </div>
        <h3>Partidas</h3>
        <div class="catalog-box">
          <strong>Asistente RGB</strong>
          <p>Calcula la pantalla LED y agrega conceptos frecuentes desde el catálogo basado en Cotizador Irving.</p>
          <div class="editor-grid">
            <label>Serie<select id="rgbSerie"><option>Nebula</option><option>Blazar</option><option>Comet</option></select></label>
            <label>Pitch (mm)<select id="rgbPitch"><option value="1.86">1.86</option><option value="2.5" selected>2.5</option><option value="4">4</option><option value="8">8</option></select></label>
            <label>Tipo<select id="rgbType"><option value="Interior">Interior</option><option value="Exterior">Exterior</option></select></label>
            <label>Ancho (m)<input id="rgbWidth" type="number" step="0.01" value="4.8"></label>
            <label>Alto (m)<input id="rgbHeight" type="number" step="0.01" value="2.88"></label>
            <label>Tipo de cambio<input id="rgbTc" type="number" step="0.01" value="17.5"></label>
          </div>
          <button type="button" class="secondary" id="applyRgb">Calcular y agregar pantalla</button>
          <button type="button" class="secondary" id="addCommon">Agregar conceptos frecuentes</button>
        </div>
        <table class="items-editor"><thead><tr><th>Descripción</th><th>Detalle</th><th>Cant.</th><th>Precio</th><th>Incluido</th><th></th></tr></thead><tbody id="itemRows"></tbody></table>
        <div class="editor-actions"><button type="button" class="secondary" id="addItem">Agregar partida</button><button type="button" class="secondary" id="cancelEdit">Cancelar</button><button type="button" id="saveEdit">Guardar en HighLevel</button></div>
      </section>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const idOf = e => e._id || e.id || '';
    const money = e => new Intl.NumberFormat('es-MX',{style:'currency',currency:e.currency || 'MXN'}).format(Number(e.total || 0));
    async function init(){
      const config = await fetch('/api/config').then(r=>r.json());
      $('mode').textContent = config.mode === 'demo' ? 'Modo demo' : 'Conectado a HighLevel';
      $('mode').classList.toggle('live', config.mode !== 'demo');
      load();
    }
    async function load(){
      $('message').textContent='Consultando...'; $('results').innerHTML='';
      const qs = new URLSearchParams({status:$('status').value,contactId:$('contactId').value,search:$('search').value});
      try{
        const response = await fetch('/api/estimates?'+qs);
        const data = await response.json();
        if(!response.ok) throw new Error(data.error || 'Error de consulta');
        render(data.estimates || []);
        $('message').textContent=`${data.estimates.length} cotización(es) encontradas.`;
      }catch(error){ $('message').textContent=error.message; }
    }
    function render(items){
      window.currentEstimates=items;
      if(!items.length){ $('results').innerHTML='<div class="empty">No se encontraron cotizaciones con estos filtros.</div>'; return; }
      const rows=items.map(e=>`<tr><td><strong>${escapeHtml(e.name || 'Sin nombre')}</strong><br><small>${escapeHtml((e.estimateNumberPrefix || 'COT-')+(e.estimateNumber || ''))}</small></td><td>${escapeHtml(e.contactDetails?.name || '-')}<br><small>${escapeHtml(e.contactDetails?.companyName || '')}</small></td><td><span class="status">${escapeHtml(e.estimateStatus || e.status || 'draft')}</span></td><td>${escapeHtml(money(e))}</td><td><div class="actions"><button type="button" class="button secondary" data-edit="${escapeHtml(idOf(e))}">Editar</button><a class="button secondary" target="_blank" href="/api/estimates/${encodeURIComponent(idOf(e))}/pdf">Vista previa</a><a class="button" href="/api/estimates/${encodeURIComponent(idOf(e))}/pdf?download=1">Descargar PDF</a></div></td></tr>`).join('');
      $('results').innerHTML=`<table><thead><tr><th>Cotización</th><th>Cliente</th><th>Estado</th><th>Total</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    let editingId = null; let editingBase = null;
    function addItemRow(item={}){
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><input data-k="name" value="${escapeHtml(item.name || '')}"></td><td><input data-k="description" value="${escapeHtml(item.description || '')}"></td><td><input data-k="qty" type="number" step="0.01" value="${Number(item.qty || 1)}"></td><td><input data-k="amount" type="number" step="0.01" value="${Number(item.amount || 0)}"></td><td><input data-k="included" type="checkbox" ${item.included ? 'checked' : ''}></td><td><button type="button" class="danger remove-item">X</button></td>`;
      tr.dataset.original=JSON.stringify(item || {});
      tr.querySelector('.remove-item').onclick=()=>tr.remove(); $('itemRows').appendChild(tr);
    }
    function openEditor(e){
      editingBase=e; editingId=idOf(e); $('editorTitle').textContent='Editar cotización'; $('fName').value=e.name||''; $('fNumber').value=e.estimateNumber||''; $('fCurrency').value=e.currency||'MXN'; $('fIssue').value=(e.issueDate||'').slice(0,10); $('fExpiry').value=(e.expiryDate||'').slice(0,10); $('fContactName').value=e.contactDetails?.name||''; $('fContactId').value=e.contactDetails?.id||''; $('fEmail').value=e.contactDetails?.email||''; $('fTerms').value=(e.termsNotes||'').replace(/<[^>]+>/g,''); $('itemRows').innerHTML=''; (e.items||[]).forEach(addItemRow); $('editor').classList.add('open'); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    }
    function newEditor(){ editingBase=null; openEditor({name:'',currency:'MXN',items:[]}); editingId=null; $('editorTitle').textContent='Nueva cotización'; $('fNumber').value=''; $('fIssue').value=new Date().toISOString().slice(0,10); $('fExpiry').value=''; $('fContactName').value=''; $('fContactId').value=''; $('fEmail').value=''; $('fTerms').value=''; $('itemRows').innerHTML=''; addItemRow(); }
    function editorPayload(){
      const currency=$('fCurrency').value || 'MXN';
      const items=[...$('itemRows').children].map(tr=>{ const v={}; tr.querySelectorAll('[data-k]').forEach(el=>v[el.dataset.k]=el.type==='checkbox'?el.checked:el.value); const original=JSON.parse(tr.dataset.original||'{}'); return {...original,name:v.name,description:v.description,qty:Number(v.qty||0),amount:Number(v.amount||0),currency:currency,taxes:Array.isArray(original.taxes)?original.taxes:[],taxInclusive:Boolean(original.taxInclusive)}; });
      const oldContact=editingBase?.contactDetails||{}; return {name:$('fName').value.trim(),estimateNumber:$('fNumber').value?Number($('fNumber').value):undefined,currency:currency,issueDate:$('fIssue').value||undefined,expiryDate:$('fExpiry').value||undefined,contactDetails:{...oldContact,id:$('fContactId').value.trim(),name:$('fContactName').value.trim(),email:$('fEmail').value.trim()},businessDetails:editingBase?.businessDetails||{},items,frequencySettings:editingBase?.frequencySettings||{enabled:false},discount:editingBase?.discount||{value:0,type:'percentage'},termsNotes:$('fTerms').value,title:editingBase?.title||'COTIZACION'};
    }
    async function saveEditor(){ const payload=editorPayload(); if(!payload.name||!payload.contactDetails.id){ $('message').textContent='Nombre y Contact ID son obligatorios para guardar.'; return; } const url=editingId?'/api/estimates/'+encodeURIComponent(editingId):'/api/estimates'; try{ const res=await fetch(url,{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const data=await res.json(); if(!res.ok) throw new Error(data.error||'No se pudo guardar'); $('message').textContent='Guardado correctamente en HighLevel.'; $('editor').classList.remove('open'); await load(); }catch(err){ $('message').textContent=err.message; } }
    $('filters').addEventListener('submit',e=>{e.preventDefault();load()}); init();
    $('newEstimate').onclick=newEditor; $('addItem').onclick=()=>addItemRow(); $('cancelEdit').onclick=()=> $('editor').classList.remove('open'); $('saveEdit').onclick=saveEditor;
    const rgbPrices={"1.86":1800,"2.5":19425.6,"4":1650,"8":1440};
    function applyRgb(){
      const pitch=$('rgbPitch').value, area=Number($('rgbWidth').value||0)*Number($('rgbHeight').value||0), tc=Number($('rgbTc').value||1);
      const unit=rgbPrices[pitch]||0, name=`Pantalla LED ${$('rgbType').value} - Serie ${$('rgbSerie').value} - Pitch ${pitch}`;
      addItemRow({name,description:`${$('rgbWidth').value}m x ${$('rgbHeight').value}m | Área ${area.toFixed(2)} m² | TC ${tc}`,qty:1,amount:unit});
    }
    function addCommon(){
      addItemRow({name:'Paquete de Electrónica',description:'Tarjetas receptoras, tarjetas de envío, cable de datos y cables eléctricos.',qty:1,amount:0});
      addItemRow({name:'Servicio de Instalación Plus',description:'Instalación, puesta en marcha y configuración.',qty:1,amount:0});
      addItemRow({name:'Complementos y accesorios (Incluye)',description:'Gabinete, importación, embalaje, flete, envío y capacitación.',qty:1,amount:0,included:true});
    }
    $('applyRgb').onclick=applyRgb; $('addCommon').onclick=addCommon;
    document.addEventListener('click',e=>{ const id=e.target.dataset?.edit; if(id){ const item=(window.currentEstimates||[]).find(x=>idOf(x)===id); if(item) openEditor(item); }});
  </script>
</body>
</html>
