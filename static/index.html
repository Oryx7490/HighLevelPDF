<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizaciones HighLevel</title>
  <style>
    :root { --ink:#12344d; --muted:#6b7c8f; --line:#d9e2ec; --brand:#116b8c; --soft:#eef6f8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; color:#1f2933; background:#f4f7f9; }
    main { width:min(1120px,calc(100% - 32px)); margin:36px auto; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
    h1 { margin:0 0 6px; color:var(--ink); font-size:30px; }
    p { color:var(--muted); margin:0; line-height:1.5; }
    .badge { padding:8px 12px; border-radius:999px; background:#fff4d6; color:#785a00; font-weight:700; font-size:13px; }
    .badge.live { background:#ddf7e8; color:#17633a; }
    .panel { background:white; border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 8px 24px rgba(18,52,77,.06); }
    form { display:grid; grid-template-columns:1fr 1fr 170px auto; gap:12px; align-items:end; }
    label { display:grid; gap:7px; color:var(--ink); font-size:13px; font-weight:700; }
    input,select,button,a.button { height:42px; border-radius:8px; border:1px solid #b8c6d1; padding:0 12px; font:inherit; }
    button,a.button { display:inline-flex; align-items:center; justify-content:center; border:0; background:var(--brand); color:white; font-weight:700; cursor:pointer; text-decoration:none; white-space:nowrap; }
    a.secondary { background:white; color:var(--ink); border:1px solid #9fb1bf; }
    .message { min-height:24px; margin:14px 0 4px; color:var(--muted); }
    table { width:100%; border-collapse:collapse; margin-top:18px; }
    th { text-align:left; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line); padding:12px 10px; }
    td { padding:14px 10px; border-bottom:1px solid #edf1f4; vertical-align:middle; }
    td:last-child { text-align:right; }
    .actions { display:flex; gap:8px; justify-content:flex-end; }
    .actions .button { height:36px; font-size:13px; }
    .status { display:inline-block; padding:5px 9px; border-radius:999px; background:var(--soft); color:var(--brand); font-size:12px; font-weight:700; }
    .empty { padding:34px; text-align:center; color:var(--muted); }
    @media(max-width:820px){ form{grid-template-columns:1fr 1fr} header{display:block}.badge{display:inline-block;margin-top:12px} }
    @media(max-width:560px){ form{grid-template-columns:1fr} table,thead,tbody,tr,th,td{display:block} thead{display:none} td{border:0;padding:5px 0} tr{padding:14px 0;border-bottom:1px solid var(--line)} td:last-child{text-align:left}.actions{justify-content:flex-start;margin-top:10px} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Cotizaciones</h1><p>Consulta borradores de HighLevel, revisa la información y genera un PDF en español.</p></div>
      <span id="mode" class="badge">Cargando...</span>
    </header>
    <section class="panel">
      <form id="filters">
        <label>ID del contacto (opcional)<input id="contactId" placeholder="Ej. 6578278e..."></label>
        <label>Buscar por nombre<input id="search" placeholder="Proyecto o cliente"></label>
        <label>Estado<select id="status"><option value="draft">Borrador</option><option value="sent">Enviada</option><option value="viewed">Vista</option><option value="accepted">Aceptada</option><option value="declined">Rechazada</option><option value="invoiced">Facturada</option><option value="all">Todos</option></select></label>
        <button type="submit">Consultar</button>
      </form>
      <div id="message" class="message"></div>
      <div id="results"></div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const idOf = e => e._id || e.id || '';
    const money = e => new Intl.NumberFormat('es-MX',{style:'currency',currency:e.currency || 'MXN'}).format(Number(e.total || 0));
    async function init(){
      const config = await fetch('/api/config').then(r=>r.json());
      $('mode').textContent = config.mode === 'demo' ? 'Modo demo' : 'Conectado a HighLevel';
      $('mode').classList.toggle('live', config.mode !== 'demo');
      load();
    }
    async function load(){
      $('message').textContent='Consultando...'; $('results').innerHTML='';
      const qs = new URLSearchParams({status:$('status').value,contactId:$('contactId').value,search:$('search').value});
      try{
        const response = await fetch('/api/estimates?'+qs);
        const data = await response.json();
        if(!response.ok) throw new Error(data.error || 'Error de consulta');
        render(data.estimates || []);
        $('message').textContent=`${data.estimates.length} cotización(es) encontradas.`;
      }catch(error){ $('message').textContent=error.message; }
    }
    function render(items){
      if(!items.length){ $('results').innerHTML='<div class="empty">No se encontraron cotizaciones con estos filtros.</div>'; return; }
      const rows=items.map(e=>`<tr><td><strong>${escapeHtml(e.name || 'Sin nombre')}</strong><br><small>${escapeHtml((e.estimateNumberPrefix || 'COT-')+(e.estimateNumber || ''))}</small></td><td>${escapeHtml(e.contactDetails?.name || '-')}<br><small>${escapeHtml(e.contactDetails?.companyName || '')}</small></td><td><span class="status">${escapeHtml(e.status || 'draft')}</span></td><td>${escapeHtml(money(e))}</td><td><div class="actions"><a class="button secondary" target="_blank" href="/api/estimates/${encodeURIComponent(idOf(e))}/pdf">Vista previa</a><a class="button" href="/api/estimates/${encodeURIComponent(idOf(e))}/pdf?download=1">Descargar PDF</a></div></td></tr>`).join('');
      $('results').innerHTML=`<table><thead><tr><th>Cotización</th><th>Cliente</th><th>Estado</th><th>Total</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    $('filters').addEventListener('submit',e=>{e.preventDefault();load()}); init();
  </script>
</body>
</html>
